name: spk286-ci

on:
  push:
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install HDL toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog yosys cmake ninja-build gtkwave
      - name: Run Phase 0 regression
        run: make regression
