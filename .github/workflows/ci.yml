name: spk286-ci

on:
  push:
  pull_request:

jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install HDL toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog yosys cmake ninja-build gtkwave nasm
      - name: Acquire pinned CPU verification references
        run: make mcl86-fetch singlestep-fetch
      - name: Validate complete Phase 7 functional delivery
        env:
          SPK286_BUILD_JOBS: 4
        run: make phase7-check
      - name: Classify strict Phase 6 architectural evidence (pending is not approval)
        run: |
          set -euo pipefail
          python3 -m tools.phase6_development --ci-status | tee phase6-architectural-status.txt
          cat phase6-architectural-status.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Report exact Phase 7 evidence notes separately
        run: |
          set -euo pipefail
          python3 -m tools.phase7_policy | tee phase7-evidence-status.txt
          cat phase7-evidence-status.txt >> "$GITHUB_STEP_SUMMARY"
